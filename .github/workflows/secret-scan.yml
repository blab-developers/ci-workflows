name: secret-scan

on:
  workflow_call:

# The one Betterleaks full-history scan for every consumer repository (ADR-0036 amendment).
# This file owns the scanner implementation: the pinned betterleaks-action SHA, the Betterleaks
# version, checkout configuration and scan mode. Consumers call it with two lines
# (`uses: blab-developers/ci-workflows/.github/workflows/secret-scan.yml@v1`) and pin nothing
# themselves. Upgrades happen here, once.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan history
        uses: dortort/betterleaks-action@3f0eb43ebee708fa2bfce02c1d25f587466542c1
        with:
          version: "v1.9.0"
          scan-mode: git
          scan-path: .
